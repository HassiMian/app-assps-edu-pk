# ASSPS SaaS Core - include INSIDE every public-facing Nginx server block.
# Replace each old unrestricted public-upload filesystem mapping.
# Do not include without removing that old location from the SAME server.
# Branding logos are the only intentionally public uploaded media.
location ^~ /uploads/branding/ {
    # Nginx's direct alias bypasses Express image policy: deny active-media
    # suffixes even if an unexpected file arrives in the branding directory.
    if ($uri !~* ^/uploads/branding/[a-z0-9][a-z0-9_.-]*\.(png|jpe?g|webp)$) {
        return 404;
    }
    alias /var/uploads/branding/;
    autoindex off;
    disable_symlinks on;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "sandbox" always;
    expires 7d;
}

# All private/unknown media paths fail closed. Identity, student documents,
# fees, proofs and other sensitive media need future per-record authorization.
location ^~ /uploads/ {
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404;
}
