# Include ONCE within the Nginx `http` context, AFTER GO certification only.
# Protected examination GETs use their authenticated login backend, never the incompatible marks canary.
# All methods not explicitly selected remain on each host-specific legacy backend.
# Keep each hostname's *actual* legacy upstream on methods not migrated.
# API host currently routes to 127.0.0.1:3000; app host currently to :5000.
# Never force api.assps.edu.pk to 5000 on an unapproved/unsupported method.
map $host $assps_marks_legacy_upstream {
    default http://127.0.0.1:3000;
    api.assps.edu.pk http://127.0.0.1:3000;
    app.assps.edu.pk http://127.0.0.1:5000;
}

map $request_method $assps_marks_catalog_upstream {
    default $assps_marks_legacy_upstream;
    GET     $assps_marks_legacy_upstream;
}
map $request_method $assps_marks_results_upstream {
    default $assps_marks_legacy_upstream;
    GET     $assps_marks_legacy_upstream;
    POST    http://127.0.0.1:5091;
}
map $request_method $assps_marks_result_detail_upstream {
    default $assps_marks_legacy_upstream;
    GET     $assps_marks_legacy_upstream;
}
