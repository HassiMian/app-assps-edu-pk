# Include ONCE within the Nginx `http` context, AFTER GO certification only.
# All methods not explicitly selected remain on the existing legacy backend.
map $request_method $assps_marks_catalog_upstream {
    default http://127.0.0.1:5000;
    GET     http://127.0.0.1:5091;
}
map $request_method $assps_marks_results_upstream {
    default http://127.0.0.1:5000;
    GET     http://127.0.0.1:5091;
    POST    http://127.0.0.1:5091;
}
map $request_method $assps_marks_result_detail_upstream {
    default http://127.0.0.1:5000;
    GET     http://127.0.0.1:5091;
}
