# Include INSIDE both `app.assps.edu.pk` and `api.assps.edu.pk` TLS server blocks
# after approved cutover. Original `/api/` location remains the default.
# Never route /api/auth, /api/students, /api/paper or /api/fees to green.
location = /api/exams {
    proxy_pass $assps_marks_catalog_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /api/exams/grade-settings {
    proxy_pass $assps_marks_catalog_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /api/exams/results {
    proxy_pass $assps_marks_results_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ~ ^/api/exams/results/[1-9][0-9]*$ {
    proxy_pass $assps_marks_result_detail_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
