# Include ONLY inside `app.assps.edu.pk` TLS server after approved cutover.
# The existing `api.assps.edu.pk` Connect host MUST remain entirely unchanged.
# Original app `/api/` location remains the default for all other requests.
# Never route /api/auth, /api/students, /api/paper or /api/fees to green.
location = /api/exams {
    proxy_pass $assps_marks_catalog_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /api/exams/grade-settings {
    proxy_pass $assps_marks_catalog_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /api/exams/results {
    proxy_pass $assps_marks_results_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ~ ^/api/exams/results/[1-9][0-9]*$ {
    proxy_pass $assps_marks_result_detail_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
