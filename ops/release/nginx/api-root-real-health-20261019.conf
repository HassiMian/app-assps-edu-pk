# Include INSIDE the app.assps.edu.pk server{} block only.
# Live applied 2026-10-19 under two independently stored Nginx configs.
# Makes /api/ a read-only backend-backed health discovery endpoint.
# This is NOT an authorization bypass, timetable Save enablement, or
# replacement for separately verifying https://api.assps.edu.pk/health.
location = /api/ {
    proxy_pass http://127.0.0.1:5000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "no-store" always;
}
