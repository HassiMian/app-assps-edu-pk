name: ASSPS Paper Studio Lesson A-B Safe Regression (source only)

on:
  push:
    branches:
      - 'audit/paper-lesson-ab-core58-regression-20261017'
      - 'test/paper-lesson-ab-legacy-ebf-ci-20261017'
      - 'feat/lesson-ab-subject-unification-exclusions-20261017'
    paths:
      - 'al-siddique-frontend/src/Modules/Paper-Generator/**'
      - 'al-siddique-frontend/scripts/verify-protected-templates.mjs'
      - '.github/workflows/paper-lesson-ab-regression-20261017.yml'
  pull_request:
    paths:
      - 'al-siddique-frontend/src/Modules/Paper-Generator/**'
      - 'al-siddique-frontend/scripts/verify-protected-templates.mjs'
      - '.github/workflows/paper-lesson-ab-regression-20261017.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lesson-source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout pinned source, never deploy
        uses: actions/checkout@v4
      - name: Use Node 22 without app secrets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify A and B labels, old A/B draft cloning guard, excluded classes and term sources
        run: >-
          node --test
          al-siddique-frontend/src/Modules/Paper-Generator/tests/plannerABMergeExclusion.test.mjs
          al-siddique-frontend/src/Modules/Paper-Generator/tests/termPlanningModel.test.mjs
      - name: Preserve six original official paper templates
        run: node al-siddique-frontend/scripts/verify-protected-templates.mjs
      - name: Preserve canonical 43-paper reference corpus
        run: >-
          node -e 'const fs=require("node:fs");const p="al-siddique-frontend/src/Modules/Paper-Generator/PaperEditor/migration/data/canonical-first-term-2026-paperdoc-v2-schema3.json";const x=JSON.parse(fs.readFileSync(p,"utf8"));if(!Array.isArray(x.documents)||x.documents.length!==43||x.paperCount!==43){console.error("PROTECTED_CORPUS_COUNT_MISMATCH");process.exit(1)}console.log("PROTECTED_CANONICAL_43_PRESENT_PASS")'
