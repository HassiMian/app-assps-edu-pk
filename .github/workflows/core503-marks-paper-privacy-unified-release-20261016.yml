name: ASSPS Core503 Marks Paper Privacy and Diary15 Integrated QA
on:
  push:
    branches:
      - 'integration/core503-marks-rls-paper-privacy-20261016'
      - 'integration/core503-privacy-expectedanswer-diary-port-20261016'
      - 'integration/core503-truefalse-http-marks-release-20261016'
      - 'fix/core-classone-urdu-locked-readonly-preflight-20261016'
      - 'integration/core503-marks-urdu-teacher-print-scope-20261016'
      - 'integration/core58-lessonab-apiguard-master-20261017'
      - 'integration/core78-lesson42-corpus-security-20261017'
      - 'fix/core78-hermetic-ci-gates-20261017'
      - 'integration/assps-core78-lesson42-corpus-unified-20261017'
      - 'integration/assps-allstreams-core0d-paper82-20261017'
      - 'integration/assps-master-core-paper-result-20261017'
  pull_request:
    paths:
      - 'al-siddique-backend/src/config/signedRlsCatalogGuard.js'
      - 'al-siddique-backend/src/config/database.js'
      - 'al-siddique-backend/src/tests/signed-runtime-catalog-contract.test.js'
      - 'ops/release/core-marks/**'
      - 'ops/paper-studio/verify_paper_api_dependency_20261017.py'
      - 'ops/release/core-infrastructure/verify_connect_green_startup_20261017.py'
      - 'ops/release/core-infrastructure/test_verify_connect_green_startup_20261017.py'
      - 'ops/paper-studio/test_verify_paper_api_dependency_20261017.py'
      - 'ops/paper-studio/verify_teacher_timetable_source_20261017.py'
      - 'ops/paper-studio/test_verify_teacher_timetable_source_20261017.py'
      - 'al-siddique-frontend/src/Modules/Paper-Generator/plannerSourceGrouping.js'
      - 'al-siddique-frontend/src/Modules/Paper-Generator/tests/plannerABMergeExclusion.test.mjs'
      - 'al-siddique-backend/src/services/assessmentPrintJobs.js'
      - 'al-siddique-backend/src/routes/assessmentStudioRoutes.js'
      - 'al-siddique-backend/src/tests/assessment-print-jobs-domain.test.js'
      - 'al-siddique-backend/src/tests/assessment-truefalse-student-projection-http-isolated.test.cjs'
      - 'al-siddique-frontend/src/Modules/examination/MarksSheet.jsx'
      - 'al-siddique-frontend/src/services/api.js'
      - 'al-siddique-frontend/src/services/marksSave401Session.test.mjs'
      - 'al-siddique-frontend/src/Modules/Paper-Generator/PaperEditor/tests/dailyDiary*.test.js'
      - 'ops/paper-studio/run_diary_release_browser_20261016.cjs'
      - '.github/workflows/core503-marks-paper-privacy-unified-release-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-nondestructive-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            al-siddique-frontend/package-lock.json
            al-siddique-backend/src/package-lock.json
      - name: Install frontend exact pinned packages (no production credentials)
        working-directory: al-siddique-frontend
        run: npm ci --no-audit --no-fund
      - name: Install exact pinned Express backend packages for HTTP privacy test
        working-directory: al-siddique-backend/src
        run: npm ci --no-audit --no-fund
      - name: Install isolated Chromium for Diary and privacy acceptance
        working-directory: al-siddique-frontend
        run: npx playwright install --with-deps chromium
      - name: Validate signed 82-table RLS and student print answer aliases, no backend secrets
        run: |
          node --test al-siddique-backend/src/tests/signed-runtime-catalog-contract.test.js al-siddique-backend/src/config/signedRlsCatalogGuard.test.cjs al-siddique-backend/src/tests/assessment-print-jobs-domain.test.js al-siddique-backend/src/tests/assessment-print-projection-boundary-static.test.js
      - name: Require real HTTP student privacy and teacher/tenant denial (synthetic actors only)
        run: node --test al-siddique-backend/src/tests/assessment-truefalse-student-projection-http-isolated.test.cjs
      - name: Fail closed on Marks POST401 logout, damaged roster, zeros or missing marks
        run: |
          node --test al-siddique-frontend/src/services/marksSave401Session.test.mjs ops/tests/marks-sheet-data-truth.test.js
      - name: Read-only fixtures for live role/ACL/RLS/peer-worker, no real production connection
        run: |
          python3 -m unittest -q ops/release/core-infrastructure/test_verify_signed_rls_catalog_drift_20261016.py ops/release/core-infrastructure/test_verify_live_role_membership_grants_20261016.py ops/release/core-infrastructure/test_verify_unsigned_rls_matrix_20261016.py ops/release/worker-probe/test_verify_worker_peer_scope_20261016.py ops/release/test_verify_private_backend_stage_rollback_20261016.py
      - name: Reject tampered Urdu marks, duplicate student IDs or fabricated school approval
        run: python3 -m unittest discover -s ops/release/core-marks -p 'test_*.py' -q
      - name: Reject untrusted Connect startup recipes or unreviewed PM2 persisted green environment
        run: python3 -m unittest -q ops/release/core-infrastructure/test_verify_connect_green_startup_20261017.py
      - name: Block transient 502 and unreviewed timetable teacher permission source regressions
        run: python3 -m unittest -q ops/paper-studio/test_verify_paper_api_dependency_20261017.py ops/paper-studio/test_verify_teacher_timetable_source_20261017.py
      - name: Protect A B English Urdu lesson subject merges and excluded classes
        run: node --test al-siddique-frontend/src/Modules/Paper-Generator/tests/plannerABMergeExclusion.test.mjs
      - name: Pin source-reviewed private A-B Chromium acceptance scripts (secure VPS witness; never a hosted browser claim)
        run: |
          printf '%s  %s\n' 'a74641a7ec259e1c2acc3c42733bfa7d3a660c2e23b558f0d5b91b6f0edd54a1' 'al-siddique-frontend/src/Modules/Paper-Generator/tests/plannerABBrowserQA.mjs' | sha256sum --check
          printf '%s  %s\n' '1c0abe79df146673286d160dc630908adc6a9975d58c9d2ea7cf3d8de73b9a1c' 'al-siddique-frontend/src/Modules/Paper-Generator/tests/plannerLegacyABCloneBrowserQA.mjs' | sha256sum --check
          echo 'PINNED_AB_BROWSER_QA_SOURCE_OK_PRIVATE_ORIGINAL_EVIDENCE_NOT_AVAILABLE_ON_HOSTED_RUNNER'
          echo 'SECURE_VPS_REAL_CHROMIUM_WITNESS_SEPARATE_FROM_HOSTED_CI_AND_NOT_LIVE_STAFF_ACCEPTANCE'
      - name: Protect all fifteen Daily Diary synthetic Chromium workflows
        run: node ops/paper-studio/run_diary_release_browser_20261016.cjs
      - name: Prevent shared port collisions and ABA diary regressions in Chromium
        run: node --test al-siddique-frontend/src/Modules/Paper-Generator/PaperEditor/tests/dailyDiaryStaleReopenBrowser.test.js
      - name: Fail closed on protected 43-paper corpus drift and verify new PG16 test syntax without DB access
        run: |
          printf '%s  %s\n' '39a2dcd58e064dd63985c7f5b57d4bed55fdb949e99db0b00bc4b1735f2f1843' 'al-siddique-frontend/src/Modules/Paper-Generator/PaperEditor/migration/data/canonical-first-term-2026-paperdoc-v2-schema3.json' | sha256sum --check
          node --check al-siddique-backend/src/tests/lesson-plans-http.test.js
      - name: Compile all protected Paper/Marks/Diary/Lesson/Early Years modules
        working-directory: al-siddique-frontend
        run: npm run build
      - name: Require complete five-feature compiled artifact, not a public release
        run: python3 ops/paper-studio/verify_full_feature_readiness_20261016.py --repo . --dist al-siddique-frontend/dist
      - name: Enforce published Diary controller retention in candidate assets
        env:
          ASSPS_DIARY_CANDIDATE_DIST: ${{ github.workspace }}/al-siddique-frontend/dist
        run: node --test ops/tests/paper-diary-active-controller-immutable-release-gate-20261015.test.cjs
