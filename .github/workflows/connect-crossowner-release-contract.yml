      - 'ops/connect/test_four_phase_release_gate_20261016.py'
      - '.github/workflows/connect-crossowner-release-contract.yml'
permissions:
  contents: read
jobs:
  fail-closed-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify synthetic negative release contracts
        run: python3 -m unittest discover -v -s ops/connect -p 'test_verify_joint_frontend_connect_core_20261015.py'
      - name: Compile preflight without external services
        run: python3 -m py_compile ops/connect/verify_joint_frontend_connect_core_20261015.py
      - name: Fail-closed private HTTP route adversarial unit tests
        run: python3 -m unittest discover -v -s ops/connect -p 'test_smoke_private_next_http_20261016.py'
      - name: Compile isolated runtime smoke tool
        run: python3 -m py_compile ops/connect/smoke_private_next_http_20261016.py
      - name: Verify published reviewed Next patch evidence and negative cases
        run: python3 -m unittest discover -v -s ops/connect -p 'test_verify_recovered_next_source_20261016.py'
      - name: Verify scoped Next lint-config repair evidence
        run: python3 -m unittest discover -v -s ops/connect -p 'test_reviewed_next_eslint_config_20261016.py'
      - name: Verify active Next lint source scope and preserved TypeScript rules
        run: python3 -m unittest discover -v -s ops/connect -p 'test_next_eslint_active_scope_20261016.py'
      - name: Verify private compiled Next runtime provenance safety contract
        run: python3 -m unittest discover -v -s ops/connect -p 'test_verify_private_next_build_20261016.py'
      - name: Guard local full-ACL recovery parity against fabricated Core certification
        run: python3 -m unittest discover -v -s ops/connect -p 'test_verify_local_full_acl_restore_20261016.py'
      - name: Guard actual successful optimized Connect Next build against forged release claims
        run: python3 -m unittest discover -v -s ops/connect -p 'test_verify_successful_next_build_20261016.py'
      - name: Ensure new optimized private stage permit is exact hash pinned
        run: node --test ops/connect/test-private-reviewed-stage-allowlist-20261016.test.cjs
      - name: Test four-phase release fail-closed decisions
        run: python3 -m unittest discover -v -s ops/connect -p 'test_four_phase_release_gate_20261016.py'

      - name: Verify public anonymous route contract without touching live production
        run: python3 -m unittest discover -v -s ops/connect -p 'test_verify_public_anonymous_routes_20261016.py'
