      - 'ops/connect/test_reviewed_next_eslint_config_20261016.py'
      - 'ops/connect/recovery/reviewed-next-eslint-active-scope-20261016.mjs'
      - 'ops/connect/test_next_eslint_active_scope_20261016.py'
