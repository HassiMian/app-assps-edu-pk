name: ASSPS Production Release Custody
on:
  push:
    branches:
      - audit/assps-a335-prod-custody-20261120
    paths:
      - 'al-siddique-frontend/production-release-custody/2026-11-20/**'
      - '.github/workflows/assps-a335-production-custody.yml'
  workflow_dispatch:
jobs:
  verify-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable static release assets
        run: |
          python3 al-siddique-frontend/production-release-custody/2026-11-20/verify_release.py --snapshot al-siddique-frontend/production-release-custody/2026-11-20
      - name: Strict candidate parity positive control
        run: |
          python3 al-siddique-frontend/production-release-custody/2026-11-20/release_guard.py \\
            --snapshot al-siddique-frontend/production-release-custody/2026-11-20 \\
            --candidate al-siddique-frontend/production-release-custody/2026-11-20
      - name: Verify release gate blocks a missing navigation overlay
        run: |
          python3 al-siddique-frontend/production-release-custody/2026-11-20/release_guard.py \\
            --snapshot al-siddique-frontend/production-release-custody/2026-11-20 --self-test
      - name: Confirm static-only verification
        run: echo "No production credentials, database changes, or VPS access required."\n