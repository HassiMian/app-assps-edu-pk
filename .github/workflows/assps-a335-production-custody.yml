name: ASSPS Production Release Custody
on:
  push:
    branches:
      - audit/assps-a335-prod-custody-20261120
    paths:
      - 'al-siddique-frontend/production-release-custody/2026-11-20/**'
      - '.github/workflows/assps-a335-production-custody.yml'
  workflow_dispatch:
jobs:
  verify-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable static assets
        run: python3 al-siddique-frontend/production-release-custody/2026-11-20/verify_release.py --snapshot al-siddique-frontend/production-release-custody/2026-11-20
      - name: Positive production-parity control
        run: python3 al-siddique-frontend/production-release-custody/2026-11-20/release_guard.py --snapshot al-siddique-frontend/production-release-custody/2026-11-20 --candidate al-siddique-frontend/production-release-custody/2026-11-20
      - name: Reject a missing navigation script
        run: python3 al-siddique-frontend/production-release-custody/2026-11-20/release_guard.py --snapshot al-siddique-frontend/production-release-custody/2026-11-20 --self-test
      - name: Validate recovery tool syntax
        run: python3 -m py_compile al-siddique-frontend/production-release-custody/2026-11-20/restore_custody.py
      - name: State release constraint
        run: echo "Static verification only; no production credentials or VPS access."
