name: Protect Lesson Planner Releases

on:
  pull_request:
    paths:
      - "al-siddique-frontend/**"
      - "al-siddique-backend/src/routes/assessmentStudioRoutes.js"
      - "al-siddique-backend/src/services/grade910PaperWorkspaceReleaseGuard.js"
      - "al-siddique-backend/src/tests/grade910-institutional-draft-validation-contract.test.js"
      - "al-siddique-backend/src/routes/opsRoutes.js"
      - "al-siddique-backend/src/services/ai/**"
      - "al-siddique-backend/src/package.json"
      - "al-siddique-backend/src/package-lock.json"
      - "ops/release/check-lesson-planner-ui.py"
      - "ops/release/guarded-lesson-planner-rollout.py"
      - "ops/release/check-preserved-companion-features.py"
      - "ops/release/verify-diary-controls-in-active-bundle-20261015.cjs"
      - "ops/tests/paper-diary-active-controller-immutable-release-gate-20261015.test.cjs"
      - "ops/release/preserved-companions-v1.json"
      - "ops/release/tests/test_preserved_companions.py"
      - "ops/release/tests/test_paper_studio_full_postflight.py"
      - "ops/release/lesson-planner-ui-contract-*.json"
      - "ops/release/tests/test_lesson_planner_ui_contract.py"
      - ".github/workflows/lesson-planner-release-contract.yml"
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "integration/**"
      - "qa/**"
      - "release/**"
    paths:
      - "al-siddique-frontend/**"
      - "al-siddique-backend/src/routes/assessmentStudioRoutes.js"
      - "al-siddique-backend/src/services/grade910PaperWorkspaceReleaseGuard.js"
      - "al-siddique-backend/src/tests/grade910-institutional-draft-validation-contract.test.js"
      - "al-siddique-backend/src/routes/opsRoutes.js"
      - "al-siddique-backend/src/services/ai/**"
      - "al-siddique-backend/src/package.json"
      - "al-siddique-backend/src/package-lock.json"
      - "ops/release/check-lesson-planner-ui.py"
      - "ops/release/guarded-lesson-planner-rollout.py"
      - "ops/release/check-preserved-companion-features.py"
      - "ops/release/verify-diary-controls-in-active-bundle-20261015.cjs"
      - "ops/tests/paper-diary-active-controller-immutable-release-gate-20261015.test.cjs"
      - "ops/release/preserved-companions-v1.json"
      - "ops/release/tests/test_preserved_companions.py"
      - "ops/release/tests/test_paper_studio_full_postflight.py"
      - "ops/release/lesson-planner-ui-contract-*.json"
      - "ops/release/tests/test_lesson_planner_ui_contract.py"
      - ".github/workflows/lesson-planner-release-contract.yml"

permissions:
  contents: read

jobs:
  production-ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node.js for frontend build
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: al-siddique-frontend/package-lock.json
      - name: Reproducible frontend install
        run: npm ci --no-audit --no-fund
        working-directory: al-siddique-frontend
      - name: Build actual deployable frontend
        run: npm run build
        working-directory: al-siddique-frontend
      - name: Verify active Lesson Planner from index import graph
        run: python3 ops/release/check-lesson-planner-ui.py --dist al-siddique-frontend/dist
      - name: Preserve live Diary / Early Years functionality before frontend cutover
        run: python3 ops/release/check-preserved-companion-features.py --dist al-siddique-frontend/dist
      - name: Enforce actual active Diary controller import graph in built release artifact
        run: node ops/release/verify-diary-controls-in-active-bundle-20261015.cjs --dist al-siddique-frontend/dist
      - name: Enforce live Marks Register View/Edit/Print active import graph
        run: node ops/release/verify-marks-register-active-bundle-20261015.cjs --dist al-siddique-frontend/dist
      - name: Reject missing, stale, or unauthorized Marks Register release bundles
        run: node --test ops/tests/marks-register-active-bundle-20261015.test.cjs
      - name: Guard existing marks against refresh-failure data loss
        run: node --test ops/tests/marks-sheet-data-truth.test.js
      - name: Lint newly introduced saved Marks Register source and test harness
        run: npx eslint src/Modules/examination/MarksRegister.jsx src/Modules/examination/tests/MarksRegisterBrowser.test.js src/Modules/examination/tests/MarksRegisterHarness.jsx
        working-directory: al-siddique-frontend
      - name: Verify immutable candidate and adversarial missing-controller detection
        run: ASSPS_DIARY_CANDIDATE_DIST=al-siddique-frontend/dist node --test ops/tests/paper-diary-active-controller-immutable-release-gate-20261015.test.cjs
      - name: Verify stale-but-present chunks cannot bypass regression check
        run: python3 -m unittest discover -s ops/release/tests -p test_lesson_planner_ui_contract.py -v
      - name: Verify V4 subject-font controls and layout-model regression
        run: |
          node --test al-siddique-frontend/src/Modules/Paper-Generator/tests/plannerSubjectTypography.test.mjs
          node --test al-siddique-frontend/src/Modules/Paper-Generator/tests/dailyServerPayload.test.mjs
          python3 -m unittest discover -s ops/release/tests -p test_lesson_v4_subject_controls.py -v
          python3 -m unittest discover -s ops/release/tests -p test_lesson_v5_daily_controls.py -v
      - name: Reproducible backend verifier dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: al-siddique-backend/src
      - name: Verify exam authorization, tenant isolation, marks validity and grade policy
        run: |
          node --test tests/tenant-clause-intersection-security.test.js tests/exam-marks-teacher-scope.test.js tests/exam-result-status-20261013.test.js tests/exam-marks-teacher-http-isolated.test.js tests/approved-exam-subject-policy-http.test.js tests/academic-assignment-guard.test.js tests/grade-band-assignment-20261014.test.js tests/exam-marks-subject-maximum.test.js
        working-directory: al-siddique-backend/src
      - name: Fail closed on AI worker role, identity and Blue fallback
        run: |
          node services/ai/test-ai-queue-worker-isolation-20261014.js
          node --test services/ai/test-ai-worker-import-boundary-20261015.cjs
        working-directory: al-siddique-backend/src
      - name: Fail closed on Grade IX/X institutional draft and official-release boundary
        run: node al-siddique-backend/src/tests/grade910-institutional-draft-validation-contract.test.js
      - name: Keep printed marks balanced across English Urdu RTL and half A4
        run: node --test al-siddique-frontend/src/Modules/Paper-Generator/tests/printMarksLedgerParity.test.mjs
      - name: Preserve Grade IX/X verified Paper Workspace authorization bridge
        run: node --test al-siddique-frontend/src/Modules/Paper-Generator/grade910PaperWorkspaceVerifiedBridge.test.mjs
      - name: Install headless browser for protected Diary and Marks acceptance
        run: npx playwright install --with-deps chromium
        working-directory: al-siddique-frontend
      - name: Lint protected Marks Register before release
        run: ./node_modules/.bin/eslint src/Modules/examination/MarksRegister.jsx src/Modules/examination/MarksSheet.jsx src/Modules/examination/tests/MarksRegisterBrowser.test.js
        working-directory: al-siddique-frontend
      - name: Verify saved Marks Register, zero-versus-blank and denied printing
        run: node --test src/Modules/examination/tests/MarksRegisterBrowser.test.js
        working-directory: al-siddique-frontend
      - name: Verify Diary exact-scope Save Reopen and cross-tenant denial in Chromium
        run: node --test src/Modules/Paper-Generator/PaperEditor/tests/dailyDiaryExplicitReopenBrowser.test.js
        working-directory: al-siddique-frontend
      - name: Verify safe rollout and original source boundaries
        run: python3 -m unittest discover -s ops/release/tests -p test_lesson_rollout_guard.py -v
      - name: Enforce protected Lesson Planning and Diary source contracts
        run: node --test ops/tests/lesson-diary-cognitive-contract.test.js
      - name: Require all three Paper Studio routes to survive real postflight
        run: python3 -m unittest discover -s ops/release/tests -p test_paper_studio_full_postflight.py -v
