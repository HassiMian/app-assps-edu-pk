name: ASSPS Exam and Result Integrity Review (No Release)

on:
  push:
    branches:
      - review/assps-unified-exam-attendance-20261030
      - review/assps-assessment-active-roster-20261030
      - review/assps-exam-modal-ack-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exams-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            al-siddique-frontend/package-lock.json
            al-siddique-backend/src/package-lock.json
      - name: Install frontend dependencies
        working-directory: al-siddique-frontend
        run: npm ci --no-audit --no-fund
      - name: Install backend dependencies
        working-directory: al-siddique-backend/src
        run: npm ci --no-audit --no-fund
      - name: Exercise marks / results / exam frontend regression suite
        working-directory: al-siddique-frontend
        run: |
          node --test src/Modules/Paper-Generator/savedCloudAssessment.test.mjs src/Modules/examination/resultCardScoreModel.test.mjs src/Modules/examination/marksInputStrict.test.mjs src/Modules/examination/marksRosterScope.test.mjs src/Modules/examination/examCreationModel.test.mjs src/Modules/examination/legacyExamWriteModel.test.mjs src/Modules/examination/resultSubjectState.test.mjs src/Modules/examination/tests/comparableResultRank.test.mjs
      - name: Install isolated Chromium for genuine component-browser acceptance
        working-directory: al-siddique-frontend
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance — failed Assessment save stays open, acknowledged retry closes
        working-directory: al-siddique-frontend
        run: node --test src/Modules/examination/tests/ExamModalReviewBrowser.test.mjs src/Modules/Paper-Generator/tests/SavedCloudReviewBrowser.test.mjs src/Modules/Paper-Generator/tests/BlankManualAssessmentBrowser.test.mjs
      - name: Exercise isolated backend route and status tests (NO database writes)
        working-directory: al-siddique-backend/src
        run: |
          node --test tests/exam-delete-retention-isolated.test.js tests/exam-creation-principal-http-isolated.test.js tests/exam-result-status-20261013.test.js
      - name: Promotion signed actor scope, class movement, and audit regression (no database writes)
        working-directory: al-siddique-backend/src
        run: node --test tests/school-scoped-movement.test.cjs tests/promote-demote-full-repair.test.cjs tests/signed-rls-catalog-contract-20261030.test.cjs
      - name: November 2026 fee duplicate-arrears and promotion-hold review (no writes)
        working-directory: al-siddique-backend/src
        run: node --test tests/november-2026-fee-safety.test.cjs
      - name: Class Eight canonical Pre Nine promotion gate regression (no write)
        working-directory: al-siddique-backend/src
        run: node --test tests/class-eight-canonical-destination-20261030.test.cjs tests/class-eight-exclude-nazra-evidence-20261030.test.cjs tests/class-eight-promotion-preflight-http.test.js
      - name: Fee Batch V3 atomic and billing-reconciliation checks (no write)
        working-directory: al-siddique-backend/src
        run: node --test tests/fee-batch-v3.test.cjs
      - name: Unified October 31 fee lesson and exam creation safety tests (no database writes)
        working-directory: al-siddique-backend/src
        run: node --test tests/fee-batch-v3.test.cjs tests/fee-batch-gap-guard-20261031.test.cjs tests/assps-lesson-scope-20261031.test.cjs tests/assps-second-term-policy.test.cjs tests/exam-create-transaction-20261031.test.cjs tests/exam-creation-principal-http-isolated.test.js
      - name: Assessment 1-4 All Classes Marks Entry contract (no database writes)
        working-directory: al-siddique-frontend
        run: node --test src/Modules/examination/assessment-all-classes-20261031.test.mjs
      - name: Targeted frontend lint
        working-directory: al-siddique-frontend
        run: |
          npx eslint src/Modules/Paper-Generator/PTSPaperGenerator.jsx src/Modules/Paper-Generator/SavedPapersTab.jsx src/Modules/Paper-Generator/PaperGenerator.jsx src/Modules/Paper-Generator/savedCloudAssessment.js src/Modules/examination/ExaminationModule.jsx src/Modules/examination/legacyExamWriteModel.js src/Modules/examination/MarksSheet.jsx src/Modules/examination/marksEntryModel.js src/Modules/examination/marksInputStrict.test.mjs src/Modules/examination/marksRosterScope.test.mjs src/Modules/examination/resultCardScoreModel.js src/Modules/examination/resultCardScoreModel.test.mjs
      - name: Full frontend build (NO deploy)
        working-directory: al-siddique-frontend
        run: npm run build
