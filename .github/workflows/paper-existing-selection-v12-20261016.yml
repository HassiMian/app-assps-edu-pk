name: ASSPS Paper Selection V12 Existing Boundary
on:
  push:
    branches:
      - 'integration/core-paper-phase3ag-*'
      - 'integration/core-worker-paper-phase3ag-*'
      - 'feat/paper-cross-field-selection-phase-*'
    paths:
      - 'ops/paper-studio/run_existing_selection_v12_20261016.cjs'
      - 'al-siddique-frontend/src/Modules/Paper-Generator/PaperEditor/tests/paperWorkspaceSelectionRegressionV12.test.js'
      - 'al-siddique-frontend/src/Modules/Paper-Generator/PaperEditor/tests/paperWorkspaceUrduVisualV13.test.js'
      - '.github/workflows/paper-existing-selection-v12-20261016.yml'
  pull_request:
    paths:
      - 'ops/paper-studio/run_existing_selection_v12_20261016.cjs'
      - 'al-siddique-frontend/src/Modules/Paper-Generator/PaperEditor/tests/paperWorkspaceSelectionRegressionV12.test.js'
      - 'al-siddique-frontend/src/Modules/Paper-Generator/PaperEditor/tests/paperWorkspaceUrduVisualV13.test.js'
      - '.github/workflows/paper-existing-selection-v12-20261016.yml'
jobs:
  isolated-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: al-siddique-frontend/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
        working-directory: al-siddique-frontend
      - name: Install isolated Chromium
        run: npx playwright install chromium --with-deps
        working-directory: al-siddique-frontend
      - name: Real Chromium baseline selection regression
        run: node ops/paper-studio/run_existing_selection_v12_20261016.cjs
