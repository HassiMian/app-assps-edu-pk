name: ASSPS School Notices Legacy Reader Containment - Source Only
on:
  push:
    branches:
      - audit/assps-notices-audience-release-hold-20261017
      - integration/assps-core742-notice-diary-unified-20261017
      - fix/core-notices-read-failclosed-20261017
      - integration/assps-canonical-lesson-quality-20261018
    paths:
      - 'al-siddique-backend/src/routes/noticesRoutes.js'
      - 'al-siddique-backend/src/tests/notices-principal-issuer-tenant-isolated.test.cjs'
      - 'ops/notices/**'
      - 'ops/tests/notices-read-audience-source-20261017.test.cjs'
      - '.github/workflows/assps-notices-audience-release-hold-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notices-release-hold-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22 for pure source checks only
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise mocked routes with ZERO school DB or credentials
        run: node --test al-siddique-backend/src/tests/notices-principal-issuer-tenant-isolated.test.cjs
      - name: Check legacy manager-only containment and adversarial mutants
        run: node --test ops/tests/notices-read-audience-source-20261017.test.cjs
      - name: Assert containment present but production is NOT certified
        run: |
          node ops/notices/verify-notice-audience-source-20261017.cjs
          node -e "const fs=require('fs');const {evaluate}=require('./ops/notices/verify-notice-audience-source-20261017.cjs');const r=evaluate(fs.readFileSync('al-siddique-backend/src/routes/noticesRoutes.js','utf8'));if(r.status!=='SOURCE_GUARD_PRESENT_NOT_LIVE_CERTIFIED'||r.production_release_authorized!==false||r.school2_authenticated!==false)process.exit(1)"
          echo 'LEGACY_READER_CONTAINED; TEACHER_DELIVERY_UNVERIFIED; DO_NOT_DEPLOY'
