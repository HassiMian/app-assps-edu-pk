name: ASSPS School Notices Audience HOLD Gate - Source Only
on:
  push:
    branches:
      - audit/assps-notices-audience-release-hold-20261017
      - integration/assps-core742-notice-diary-unified-20261017
      - fix/assps-notices-read-failclosed-20261017
    paths:
      - 'al-siddique-backend/src/routes/noticesRoutes.js'
      - 'al-siddique-backend/src/tests/notices-principal-issuer-tenant-isolated.test.cjs'
      - 'ops/notices/**'
      - 'ops/tests/notices-read-audience-source-20261017.test.cjs'
      - '.github/workflows/assps-notices-audience-release-hold-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notices-release-hold-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22 for pure source checks only
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise mocked routes with ZERO school DB or credentials
        run: node --test al-siddique-backend/src/tests/notices-principal-issuer-tenant-isolated.test.cjs
      - name: Test that missing notice-reader policy is detected
        run: node --test ops/tests/notices-read-audience-source-20261017.test.cjs
      - name: Assert admin-only source guard and STILL HOLD independent release certification
        shell: bash
        run: |
          set -euo pipefail
          result=$(node ops/notices/verify-notice-audience-source-20261017.cjs)
          printf '%s\n' "$result"
          echo "$result" | grep -q 'SOURCE_GUARD_PRESENT_NOT_LIVE_CERTIFIED'
          echo "$result" | grep -q '"production_release_authorized": false'
          echo "$result" | grep -q '"school2_authenticated": false'
          echo 'EXPECTED_HOLD_TEACHER_AUDIENCE_AND_LIVE_RELEASE; DO_NOT_DEPLOY'
