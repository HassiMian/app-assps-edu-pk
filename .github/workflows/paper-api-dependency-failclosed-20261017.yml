name: ASSPS Paper Studio API Dependency Fail-Closed (Synthetic)
on:
  push:
    branches:
      - 'audit/paper-api-dependency-failclosed-*'
    paths:
      - 'ops/paper-studio/verify_paper_api_dependency_20261017.py'
      - 'ops/paper-studio/test_verify_paper_api_dependency_20261017.py'
      - '.github/workflows/paper-api-dependency-failclosed-20261017.yml'
  pull_request:
    paths:
      - 'ops/paper-studio/verify_paper_api_dependency_20261017.py'
      - 'ops/paper-studio/test_verify_paper_api_dependency_20261017.py'
      - '.github/workflows/paper-api-dependency-failclosed-20261017.yml'
permissions:
  contents: read
jobs:
  simulated-dependency-failure-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate injected 502, restarts, protected 401 and no release bypass
        run: python -m unittest discover -s ops/paper-studio -p 'test_verify_paper_api_dependency_20261017.py' -v
      - name: Syntax validation only; no school credentials or live probes in GitHub CI
        run: python -m py_compile ops/paper-studio/verify_paper_api_dependency_20261017.py
