jobs:
  source-claim-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Keep database untouched while testing author metadata claims
        run: python3 -m unittest discover -s ops/tests -p test_grade910_live_source_claim_recovery_20261016.py -v
      - name: Validate near-stem screening respects changed scientific qualifiers
        run: python3 -m unittest discover -s ops/tests -p test_grade910_held170_near_duplicate_screen_20261016.py -v
      - name: Validate PDF page-bounds technical contract without production PDFs
        run: node --test ops/tests/grade910-physical-pdf-page-bounds-20261016.test.mjs
      - name: Validate exact PDF text-layer matching without false faculty approvals
        run: node --test ops/tests/grade910-pdf-question-text-evidence-20261016.test.mjs
      - name: Validate private resumable OCR checkpoints and fail-closed provenance
        run: node --test ops/tests/grade910-ocr-resume-guard-20261016.test.mjs
      - name: Validate last-resort English OCR fallback never claims faculty approvals
        run: node --test ops/tests/grade910-scanned-source-ocr-fallback-20261016.test.mjs
      - name: Validate read-only MCQ answer text correspondence without academic self-approval
        run: python3 -m unittest discover -s ops/tests -p test_grade910_live_answer_integrity_20261016.py -v
      - name: Maintain phase-wise machine evidence without fabricated academic publication
        run: python3 -m unittest discover -s ops/tests -p test_grade910_six_phase_receipt_20261016.py -v
      - name: Verify live-bank duplicates and numeric/chemical contrasts remain separate
        run: python3 -m unittest discover -s ops/tests -p test_grade910_live_question_collisions_20261016.py -v
      - name: Do not conflate official catalog with school textbook adoption
        run: python3 -m unittest discover -s ops/tests -p test_school1_versioned_textbook_adoption_20261016.py -v
      - name: Verify revision-specific live hashes and existing 56 faculty cohort evidence queue
        run: |
          python3 -m unittest discover -s ops/tests -p test_grade910_live_question_revision_hashes_20261016.py -v
          python3 -m unittest discover -s ops/tests -p test_grade910_live_numerical_evidence_20261016.py -v
          python3 -m unittest discover -s ops/tests -p test_grade910_live_revision_history_20261016.py -v
          python3 -m unittest discover -s ops/tests -p test_grade910_live_revision_history_20261016.py -v
          python3 -m unittest discover -s ops/tests -p test_grade910_live_source_review_delta_20261016.py -v
      - name: Verify restricted-role QBank tenant isolation cannot be forged as staff login
        run: python3 -m unittest discover -s ops/tests -p test_grade910_runtime_question_bank_rls_20261016.py -v
      - name: Validate current live-revision numerical recomputation backlog
        run: python3 -m unittest discover -s ops/tests -p test_grade910_numerical_review_priority_20261016.py -v
      - name: Validate offline claim auditor syntax
        run: python3 -m py_compile ops/qbank/audit-live-grade910-source-claims-20261016.py ops/qbank/reconcile-grade910-held-original-candidates-20261016.py
