name: ASSPS Grade IX-X source-claim safety contract
on:
  push:
    paths:
      - "ops/qbank/audit-live-grade910-source-claims-20261016.py"
      - "ops/qbank/reconcile-grade910-held-original-candidates-20261016.py"
      - "ops/qbank/assps-grade910-held170-near-duplicate-screen-20261016.py"
      - "ops/qbank/verify-grade910-pdf-physical-page-bounds-20261016.mjs"
      - "ops/tests/grade910-physical-pdf-page-bounds-20261016.test.mjs"
      - "ops/tests/test_grade910_held170_near_duplicate_screen_20261016.py"
      - "ops/tests/test_grade910_170_original_reconciliation_20261016.py"
      - "docs/question-bank/ASSPS_GRADE910_2581_PUBLIC_SAFE_REVIEW_CROSSWALK_20261015.json"
      - "docs/question-bank/ASSPS_GRADE910_UNIFIED_2581_FACULTY_CONTENT_REVIEW_PRIORITIES_20261011.json"
      - "ops/tests/test_grade910_live_source_claim_recovery_20261016.py"
      - "ops/release/assps-grade910-live-source-claims.*"
      - "ops/release/install-assps-grade910-sourceclaims-20261016.sh"
      - ".github/workflows/grade910-live-source-claim-contract-20261016.yml"
  pull_request:
    paths:
      - "ops/qbank/audit-live-grade910-source-claims-20261016.py"
      - "ops/qbank/reconcile-grade910-held-original-candidates-20261016.py"
      - "ops/qbank/assps-grade910-held170-near-duplicate-screen-20261016.py"
      - "ops/qbank/verify-grade910-pdf-physical-page-bounds-20261016.mjs"
      - "ops/tests/grade910-physical-pdf-page-bounds-20261016.test.mjs"
      - "ops/tests/test_grade910_held170_near_duplicate_screen_20261016.py"
      - "ops/tests/test_grade910_170_original_reconciliation_20261016.py"
      - "docs/question-bank/ASSPS_GRADE910_2581_PUBLIC_SAFE_REVIEW_CROSSWALK_20261015.json"
      - "docs/question-bank/ASSPS_GRADE910_UNIFIED_2581_FACULTY_CONTENT_REVIEW_PRIORITIES_20261011.json"
      - "ops/tests/test_grade910_live_source_claim_recovery_20261016.py"
      - "ops/release/assps-grade910-live-source-claims.*"
jobs:
  source-claim-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Keep database untouched while testing author metadata claims
        run: python3 -m unittest discover -s ops/tests -p test_grade910_live_source_claim_recovery_20261016.py -v
      - name: Validate near-stem screening respects changed scientific qualifiers
        run: python3 -m unittest discover -s ops/tests -p test_grade910_held170_near_duplicate_screen_20261016.py -v
      - name: Validate PDF page-bounds technical contract without production PDFs
        run: node --test ops/tests/grade910-physical-pdf-page-bounds-20261016.test.mjs
      - name: Validate offline claim auditor syntax
        run: python3 -m py_compile ops/qbank/audit-live-grade910-source-claims-20261016.py ops/qbank/reconcile-grade910-held-original-candidates-20261016.py
