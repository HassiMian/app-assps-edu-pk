jobs:
  source-claim-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Keep database untouched while testing author metadata claims
        run: python3 -m unittest discover -s ops/tests -p test_grade910_live_source_claim_recovery_20261016.py -v
      - name: Validate near-stem screening respects changed scientific qualifiers
        run: python3 -m unittest discover -s ops/tests -p test_grade910_held170_near_duplicate_screen_20261016.py -v
      - name: Validate PDF page-bounds technical contract without production PDFs
        run: node --test ops/tests/grade910-physical-pdf-page-bounds-20261016.test.mjs
      - name: Validate exact PDF text-layer matching without false faculty approvals
        run: node --test ops/tests/grade910-pdf-question-text-evidence-20261016.test.mjs
      - name: Validate private resumable OCR checkpoints and fail-closed provenance
        run: node --test ops/tests/grade910-ocr-resume-guard-20261016.test.mjs
      - name: Validate last-resort English OCR fallback never claims faculty approvals
        run: node --test ops/tests/grade910-scanned-source-ocr-fallback-20261016.test.mjs
      - name: Validate read-only MCQ answer text correspondence without academic self-approval
        run: python3 -m unittest discover -s ops/tests -p test_grade910_live_answer_integrity_20261016.py -v
      - name: Maintain phase-wise machine evidence without fabricated academic publication
        run: python3 -m unittest discover -s ops/tests -p test_grade910_six_phase_receipt_20261016.py -v
      - name: Verify live-bank duplicates and numeric/chemical contrasts remain separate
        run: python3 -m unittest discover -s ops/tests -p test_grade910_live_question_collisions_20261016.py -v
      - name: Do not conflate official catalog with school textbook adoption
        run: python3 -m unittest discover -s ops/tests -p test_school1_versioned_textbook_adoption_20261016.py -v
      - name: Verify revision-specific live hashes and existing 56 faculty cohort evidence queue
        run: |
          python3 -m unittest discover -s ops/tests -p test_grade910_live_question_revision_hashes_20261016.py -v
          python3 -m unittest discover -s ops/tests -p test_grade910_live_numerical_evidence_20261016.py -v
          python3 -m unittest discover -s ops/tests -p test_grade910_live_revision_history_20261016.py -v
          python3 -m unittest discover -s ops/tests -p test_grade910_live_revision_history_20261016.py -v
          python3 -m unittest discover -s ops/tests -p test_grade910_live_source_review_delta_20261016.py -v
      - name: Verify restricted-role QBank tenant isolation cannot be forged as staff login
        run: python3 -m unittest discover -s ops/tests -p test_grade910_runtime_question_bank_rls_20261016.py -v
      - name: Validate current live-revision numerical recomputation backlog
        run: python3 -m unittest discover -s ops/tests -p test_grade910_numerical_review_priority_20261016.py -v
      - name: Independently recompute 21 original numerical proofs with source-blob and revision tamper guard
        run: python3 -m unittest discover -s ops/tests -p test_grade910_numerical_deep_recompute_20261016.py -v
      - name: Check additive numerical audit hook installer shell syntax
        run: bash -n ops/release/install-grade910-80-numeric-audit-hook-20261016.sh
      - name: Protect 80-of-80 machine recalculation from fabricated academic signoff
        run: |
          python3 -m unittest discover -s ops/tests -p test_grade910_six_phase_current_numeric_proof_20261016.py -v
          bash -n ops/release/install-grade910-current-sixphase-numeric-20261016.sh
      - name: Fail closed on equivalent current-revision MCQ distractors
        run: |
          python3 -m unittest discover -s ops/tests -p test_grade910_live_mcq_choice_equivalence_20261016.py -v
          bash -n ops/release/install-grade910-809-mcq-choice-gate-20261016.sh
      - name: Independently screen all 1522 subjective answer risks without academic publication
        run: |
          python3 -m unittest discover -s ops/tests -p test_grade910_subjective_answer_depth_20261016.py -v
          python3 -m unittest discover -s ops/tests -p test_grade910_subjective_six_phase_gate_20261016.py -v
          bash -n ops/release/install-grade910-subjective-depth-and-sixphase-20261016.sh
      - name: Test immutable read-only live subject/chapter coverage projection
        run: python3 -m unittest discover -s ops/tests -p test_grade910_live_subject_chapter_coverage_20261016.py -v
      - name: Reuse 166 historical long-answer research IDs without unearned academic approval
        run: |
          python3 -m unittest discover -s ops/tests -p test_grade910_existing_long_answer_proposal_crosswalk_20261016.py -v
          python3 -m unittest discover -s ops/tests -p test_grade910_historical_answer_research_phase_guard_20261016.py -v
          bash -n ops/release/install-grade910-existing-answer-research-crosswalk-20261016.sh
      - name: Protect ten original Urdu Biology research explanations from false academic approval
        run: |
          python3 -m unittest discover -s ops/tests -p test_grade910_biology10_urdu_ten_explanation_drafts_20261016.py -v
          python3 -m py_compile ops/qbank/author-grade10-urdu-biology-ten-research-answers-20261016.py
      - name: Regression check 14 more independent Urdu Biology and Computer research drafts
        run: |
          python3 -m unittest discover -s ops/tests -p test_grade910_new_fourteen_urdu_original_explanations_20261016.py -v
          # Live private ledger gate is tested only in the protected VPS audit.
          python3 -m py_compile ops/qbank/author-grade9-biology8-grade10-computer6-urdu-research-20261016.py
      - name: Validate ten original non-operational Chemistry Urdu research explanations
        run: |
          python3 -m unittest discover -s ops/tests -p test_grade910_new_ten_urdu_chemistry_original_research_20261016.py -v
          python3 -m py_compile ops/qbank/author-grade10-urdu-chemistry-ten-safe-conceptual-answers-20261016.py
      - name: Verify 29 original English essay exemplars and Urdu Chemistry explanations without teacher approval
        run: |
          python3 -m unittest discover -s ops/tests -p test_grade910_english21_essay_exemplar_research_20261016.py -v
          python3 -m unittest discover -s ops/tests -p test_grade9_urdu_chemistry8_conceptual_answers_20261016.py -v
          python3 -m py_compile ops/qbank/author-grade910-english-21-essay-exemplars-20261016.py ops/qbank/author-grade9-urdu-chemistry-eight-conceptual-20261016.py
      - name: Verify school adoption vs public catalog and the 2026 ALP year firewall
        run: |
          python3 -m unittest discover -s ops/tests -p test_grade910_2026_27_catalog_vs_assps_adoption_evidence_20261016.py -v
