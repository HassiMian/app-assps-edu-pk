name: Core private backend stage and rollback parity hermetic tests
on:
  push:
    paths:
      - "ops/release/verify_private_backend_stage_rollback_20261016.py"
      - "ops/release/test_verify_private_backend_stage_rollback_20261016.py"
      - ".github/workflows/core-stage-rollback-parity-20261016.yml"
  workflow_dispatch:
jobs:
  hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail closed on archive/live/source mismatches
        run: python3 -m unittest discover -s ops/release -p test_verify_private_backend_stage_rollback_20261016.py -v
